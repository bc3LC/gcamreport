name: docs

on:
  push:
    branches:
      - gcam-core
      - gcam-iamcompact
      - dev
  pull_request:
      branches: [ '**' ]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GH_GCAMREPORT_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Install dependencies
        run: |
          install.packages("pak")
          # 1. Install all system libs and R deps automatically
          pak::local_install_dev_deps()
          # 2. Specifically install pkgdown and any extra GitHub tools
          pak::pkg_install("pkgdown")
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # pkgdown is now safely installed with all its sub-deps
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
